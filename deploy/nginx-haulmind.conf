# /etc/nginx/sites-available/haulmind   (ln -s to sites-enabled)
# Replace YOUR-DOMAIN, then run:  sudo certbot --nginx -d YOUR-DOMAIN
server {
    listen 80;
    server_name YOUR-DOMAIN;

    # Vouch imports (Excel / POD zip) and POD photos can be large
    client_max_body_size 150m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/pdf image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # big imports / P&L over a full year
    }

    # built frontend assets have hashed names – cache them hard
    location /assets/ {
        proxy_pass http://127.0.0.1:5000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
